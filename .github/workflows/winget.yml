name: Submit to winget

# Opens a PR to microsoft/winget-pkgs updating the manifest for a version
# that has ALREADY been published as a signed GitHub Release.
#
# This is a DELIBERATE, MANUAL action (workflow_dispatch). It intentionally
# does NOT chain off any CI build: official MSIs are built and signed locally
# via scripts/release.ps1 and published by hand, so the release asset (and
# its SHA256) is the trustworthy source of truth. Run this only after the
# signed release for the given version is live.
#
# REQUIRED ONE-TIME SETUP:
#   1. Make the FIRST submission manually with `wingetcreate new` so the
#      package identifier (MSEndpointMgr.1PhoneMirror) exists in the index.
#   2. Create a Personal Access Token (classic) with `public_repo` scope.
#      Store it as a repository secret named WINGET_TOKEN.
#   3. (Optional) Fork microsoft/winget-pkgs into your account beforehand;
#      wingetcreate will reuse it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0) — must already have a signed GitHub Release'
        required: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Resolve version + asset URL
        id: ctx
        shell: pwsh
        run: |
          $tag = 'v${{ github.event.inputs.version }}'
          $version = $tag -replace '^v',''
          $url = "https://github.com/MSEndpointMgr/1PhoneMirror/releases/download/$tag/1PhoneMirror-$version.msi"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "url=$url"        >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
          Write-Host "URL:     $url"

          # The signed release asset must already be published. Confirm it is
          # reachable before submitting (allow for CDN propagation, up to 3 min).
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            try {
              Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -ErrorAction Stop | Out-Null
              Write-Host "Public asset is reachable."
              break
            } catch {
              Write-Host "Waiting for public release asset..."
              Start-Sleep -Seconds 10
            }
          }

      - name: Submit manifest via wingetcreate
        # The community `vedantmgoyal9/winget-releaser` action (both @main
        # and @v2) constructs its existence-check URL with a literal
        # backslash on Windows (`manifests/m\Publisher/...`), which 404s
        # and aborts before any PR is opened. Replaced with the official
        # Microsoft `wingetcreate` CLI, which is what most reliable winget
        # publish pipelines use directly.
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.ctx.outputs.version }}
          URL: ${{ steps.ctx.outputs.url }}
        run: |
          # Download the latest wingetcreate release binary directly.
          # `aka.ms/wingetcreate/latest` redirects to the current self-
          # contained .exe published by microsoft/winget-create.
          $exe = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' `
                            -OutFile $exe -UseBasicParsing
          if (-not (Test-Path $exe)) { throw "wingetcreate download failed" }
          & $exe --version

          # `update` automatically forks microsoft/winget-pkgs (if needed),
          # commits the new version manifest, and opens a PR. `--submit`
          # is required for it to actually open the PR.
          & $exe update MSEndpointMgr.1PhoneMirror `
            --version $env:VERSION `
            --urls   $env:URL `
            --submit `
            --token  $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate update failed (exit $LASTEXITCODE)" }
